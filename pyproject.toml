[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zenkit-mcp"
dynamic = ["version"]
description = "MCP server exposing Zenkit project management tools to AI agents."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "zenkit", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.1,<5",
]

[project.scripts]
zenkit-mcp = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\d+\.\d+\.\d+(?:[.-][0-9A-Za-z.-]+)?)$'

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]
